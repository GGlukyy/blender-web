# Runs every enabled stage (ci-stages.txt) on each PR and on main.
# This is the "is it really green?" check you look at before merging a night PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache xvfb libgl1-mesa-dri libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore caches (read-only here; the nightly job owns them)
        uses: actions/cache/restore@v4
        with:
          path: |
            emsdk
            blender
            desktop-blender
          key: tools-${{ hashFiles('versions.env') }}

      - uses: actions/cache/restore@v4
        with:
          path: |
            deps
            build-wasm
          key: build-${{ hashFiles('versions.env') }}-none
          restore-keys: |
            build-${{ hashFiles('versions.env') }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ hashFiles('versions.env') }}
          max-size: 4G

      - name: Run enabled stages
        run: |
          # cached ./blender may hold old work — rebuild it from tag + this PR's patch
          if [ -d blender/.git ]; then scripts/prepare_blender.sh --reset; fi
          scripts/ci.sh

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-out-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
