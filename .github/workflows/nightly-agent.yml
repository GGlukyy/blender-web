# Unattended agent run (nights before school days).
# Claude Code works on the CURRENT milestone, commits locally, and this workflow opens a PR.
#
# Setup (once): repo secret CLAUDE_CODE_OAUTH_TOKEN  ← run `claude setup-token` on your PC.
# Manual start: Actions tab → "Agent run" → Run workflow.
name: Agent run

on:
  schedule:
    # Dva běhy denně, i o víkendu. Cron je v UTC (Praha v zimě = UTC+1, v létě UTC+2):
    #   19:15 UTC = večer 20:15 v zimě / 21:15 v létě (po špičce Claude ~14–20 h)
    #   23:30 UTC = noc 00:30 v zimě / 01:30 v létě
    # Když večerní běh ještě běží, noční počká ve frontě (concurrency) a začne po něm.
    - cron: "15 19 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Agent time budget in minutes (max 270)"
        default: "270"
      model:
        description: "Model: sonnet = rychlý a šetří limity · opus = chytřejší na těžké problémy (rychleji bere limity)"
        type: choice
        options: [sonnet, opus]
        default: sonnet
      effort:
        description: "Jak moc přemýšlí: medium = běžně · high = těžké problémy"
        type: choice
        options: [medium, high]
        default: medium

concurrency:
  group: nightly-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  night:
    runs-on: ubuntu-24.04
    timeout-minutes: 355            # GitHub-hosted job limit is 360
    env:
      AGENT_MINUTES: ${{ github.event.inputs.minutes || '270' }}
      # Scheduled (night) runs always use sonnet + medium.
      AGENT_MODEL: ${{ github.event.inputs.model || 'sonnet' }}
      AGENT_EFFORT: ${{ github.event.inputs.effort || 'medium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable (repo is edited from Windows)
        run: chmod +x scripts/*.sh scripts/stages/*.sh tools/*.sh

      - name: Free disk space (Blender builds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache xvfb libgl1-mesa-dri libegl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set deadline for the agent
        run: |
          echo "AGENT_DEADLINE=$(( $(date +%s) + AGENT_MINUTES * 60 ))" >> "$GITHUB_ENV"
          echo "NIGHT_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Git identity for local commits
        run: |
          git config --global user.name "blender-web-agent"
          git config --global user.email "blender-web-agent@users.noreply.github.com"

      # ---------- caches (restore) ----------
      - name: Cache key inputs
        id: keys
        run: |
          echo "versions=${{ hashFiles('versions.env') }}" >> "$GITHUB_OUTPUT"
          echo "patch=${{ hashFiles('patches/blender-web.patch') }}" >> "$GITHUB_OUTPUT"

      - name: Restore emsdk + Blender source + desktop Blender
        uses: actions/cache/restore@v4
        with:
          path: |
            emsdk
            blender
            desktop-blender
          key: tools-${{ steps.keys.outputs.versions }}

      - name: Restore deps + build dir
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            build-wasm
          key: build-${{ steps.keys.outputs.versions }}-${{ github.run_id }}
          restore-keys: |
            build-${{ steps.keys.outputs.versions }}-

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ steps.keys.outputs.versions }}
          max-size: 4G

      # ---------- the agent ----------
      - name: Claude Code — night shift
        id: agent
        continue-on-error: true      # even if the agent hits a limit, we still save work + open a PR
        timeout-minutes: 280
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read .github/agent/nightly-prompt.md and do exactly what it says.
            Tonight's date (UTC) is ${{ env.NIGHT_DATE }}.
          claude_args: >-
            --model ${{ env.AGENT_MODEL }}
            --effort ${{ env.AGENT_EFFORT }}
            --max-turns 500
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,WebSearch,TodoWrite,Agent,Task"

      # ---------- save everything, even after failure ----------
      - name: Save patch if the agent forgot
        if: always()
        run: |
          if [ -d blender/.git ]; then tools/save_patch.sh; fi
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Běh ${NIGHT_DATE}: automatické uložení rozdělané práce"
          fi

      # PRs opened with the default GITHUB_TOKEN do not trigger other workflows (ci.yml),
      # so we verify here and put the result into the PR description.
      - name: Verify — run enabled CI stages
        id: verify
        if: always()
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -o pipefail
          mkdir -p out
          scripts/ci.sh 2>&1 | tee out/verify.txt

      # GitHub refuses the push if the branch edits workflow files (GITHUB_TOKEN has no
      # "workflows" permission) or contains files > 100 MB. Squash the night's work into one
      # commit without those, and keep a full backup (git bundle) as an artifact.
      - name: Make the night's work pushable
        if: always()
        run: |
          mkdir -p out
          BASE=$(git rev-parse "${GITHUB_SHA}")
          if [ "$(git rev-parse HEAD)" = "$BASE" ]; then echo "no commits"; exit 0; fi
          git log --oneline "$BASE"..HEAD > out/agent-commits.txt
          git bundle create out/agent-work.bundle "$BASE"..HEAD || true
          git reset -q --soft "$BASE"
          : > out/excluded.txt
          if ! git diff --cached --quiet -- .github/workflows; then
            git reset -q -- .github/workflows && git checkout -q -- .github/workflows
            echo ".github/workflows/* (agent nesmí měnit workflowy — změny jsou v agent-work.bundle)" >> out/excluded.txt
          fi
          git diff --cached --name-only --diff-filter=AM | while read -r f; do
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 50000000 ]; then
              echo "$f ($(du -h "$f" | cut -f1), soubor > 50 MB)" >> out/excluded.txt
              git reset -q -- "$f"; mkdir -p "out/excluded/$(dirname "$f")"; mv "$f" "out/excluded/$f"
            fi
          done
          { echo "Běh ${NIGHT_DATE}: práce agenta"; echo; cat out/agent-commits.txt; } > out/commit-msg.txt
          git commit -q -F out/commit-msg.txt || echo "nothing left to commit"
          echo "excluded:"; cat out/excluded.txt

      - name: Build PR description
        if: always()
        run: |
          mkdir -p out
          {
            if [ "${{ steps.verify.outcome }}" = "success" ]; then
              echo "## ✅ CI: všechny zapnuté stage prošly"
            else
              echo "## ❌ CI: něco neprošlo — NEMERGUJ, napiš @claude"
            fi
            echo
            echo '```'
            grep -E "STAGE (PASS|FAIL)|CI ALL PASS" out/verify.txt 2>/dev/null || echo "(žádný výstup)"
            echo '```'
            echo
            echo "Agent: **${{ steps.agent.outcome }}** · Artefakty (logy, screenshoty): v běhu Actions → Artifacts"
            if [ -s out/excluded.txt ]; then
              echo
              echo "⚠️ **Vynecháno z PR** (záloha v artefaktu \`agent-work.bundle\`):"
              sed 's/^/- /' out/excluded.txt
            fi
            echo
            echo "---"
            echo
            cat STATUS.md
          } > out/pr-body.md

      - name: Save emsdk + Blender source + desktop Blender
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            emsdk
            blender
            desktop-blender
          key: tools-${{ steps.keys.outputs.versions }}
        continue-on-error: true      # already exists → fine

      - name: Save deps + build dir
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            build-wasm
          key: build-${{ steps.keys.outputs.versions }}-${{ github.run_id }}
        continue-on-error: true

      - name: Upload test outputs (screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-${{ env.NIGHT_DATE }}-out
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Open Pull Request for review
        id: cpr
        if: always()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: run/${{ env.NIGHT_DATE }}-${{ github.run_id }}
          title: "Běh ${{ env.NIGHT_DATE }} (${{ env.AGENT_MODEL }}/${{ env.AGENT_EFFORT }}) — agent ${{ steps.agent.outcome }}, CI ${{ steps.verify.outcome }}"
          body-path: out/pr-body.md
          labels: night-run
          delete-branch: true

      # Green work goes straight to main, so the next run continues from it.
      # Red runs stay as an open PR for Lukáš (+ backup bundle in artifacts).
      - name: Auto-merge when CI is green
        if: always() && steps.verify.outcome == 'success' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --repo "${{ github.repository }}"
          echo "Merged PR #${{ steps.cpr.outputs.pull-request-number }}"
